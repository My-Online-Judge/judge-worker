name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: docker.io/thanhtuanle/judge-worker

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Test
        run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: >-
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .

      - name: Runs as uid 10001
        run: test "$(docker run --rm --entrypoint id "$IMAGE:${{ github.sha }}" -u)" = 10001

      - name: Trivy (CRITICAL with a fix fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image above (amd64) is the one tested and scanned. What is pushed is built again for amd64 and arm64, so the same tag runs on the
      # server and on an Apple-silicon laptop; the Dockerfile builds the platform-independent part natively, so arm64 is not emulated for it.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push the multi-arch image
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --push -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
